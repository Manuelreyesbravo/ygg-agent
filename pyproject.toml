[project]
name = "ygg-agent"
version = "0.1.0"
description = "Run an LLM agent on PostgreSQL through pg_agent_gate, with no MCP: the model writes SQL, the database decides."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Manuel Reyes Bravo", email = "manuelreyesbravo@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["psycopg>=3.2"]
keywords = ["postgresql", "agents", "llm", "pg_agent_gate", "security"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.optional-dependencies]
binary = ["psycopg[binary]>=3.2"]

[project.urls]
Source = "https://github.com/Manuelreyesbravo/ygg-agent"
"pg_agent_gate" = "https://github.com/Manuelreyesbravo/pg_agent_gate"

[dependency-groups]
dev = ["pytest>=8", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ygg_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
